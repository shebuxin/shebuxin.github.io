<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" role="img"><style>.ed-wire{fill:none;stroke:#29262e;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.ed-axis{fill:none;stroke:#b9b1c3;stroke-width:1}.ed-text{font:14px system-ui,sans-serif;fill:#696273}.ed-label{font:16px system-ui,sans-serif;fill:#29262e}.ed-heading{font:600 17px system-ui,sans-serif;fill:#512888}.ed-math{font:italic 21px Georgia,"Times New Roman",serif;fill:#29262e}.ed-small{font:12px system-ui,sans-serif;fill:#696273}.ed-core{stroke:#8b8691;stroke-width:1.4;fill:none}.stage-circuit-wire{fill:none;stroke:#29262e;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.stage-circuit-core{fill:none;stroke:#8b8691;stroke-width:1.4}.stage-circuit-symbol{font:italic 22px Georgia,"Times New Roman",serif;fill:#29262e}.stage-circuit-value{font:14px system-ui,sans-serif;fill:#5a5363}.stage-circuit-heading{font:600 16px system-ui,sans-serif;fill:#512888}</style><defs><marker id="ed-transformer-network-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#512888"/></marker><marker id="ed-transformer-network-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a33e3e"/></marker><marker id="ed-transformer-network-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0877a0"/></marker><marker id="ed-transformer-network-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b57813"/></marker><marker id="ed-transformer-network-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087e75"/></marker></defs><title>Y–Δ 变压器正序等效电路</title>
      <desc>高压侧串联等效阻抗连接理想变压器。高、低压侧回路彼此电气隔离。两侧电压上正下负，高压电流流入、低压电流流出。所有相量采用固定基准的标幺值，忽略励磁支路。</desc>
      <defs>
        <marker id="stage-circuit-h-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a33e3e" stroke-width="1.5"/></marker>
        <marker id="stage-circuit-l-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#0877a0" stroke-width="1.5"/></marker>
      </defs>
      <text x="400" y="28" text-anchor="middle" class="stage-circuit-heading">Y–Δ 正序等效电路</text>
      <g class="stage-circuit-wire">
        <path d="M115 140H250 M335 140H475V152 M475 252V265H115 M525 152V140H720 M525 252V265H720"/>
        <rect x="250" y="127" width="85" height="26"/>
        <path d="M475 152a12.5 12.5 0 0 1 0 25a12.5 12.5 0 0 1 0 25a12.5 12.5 0 0 1 0 25a12.5 12.5 0 0 1 0 25 M525 152a12.5 12.5 0 0 0 0 25a12.5 12.5 0 0 0 0 25a12.5 12.5 0 0 0 0 25a12.5 12.5 0 0 0 0 25"/>
        <g fill="#fff"><circle cx="115" cy="140" r="3.5"/><circle cx="115" cy="265" r="3.5"/><circle cx="720" cy="140" r="3.5"/><circle cx="720" cy="265" r="3.5"/></g>
      </g>
      <path d="M497 151V253 M503 151V253" class="stage-circuit-core"/>
      <path d="M145 76H215" fill="none" stroke="#a33e3e" stroke-width="2" marker-end="url(#stage-circuit-h-arrow)"/>
      <path d="M615 76H685" fill="none" stroke="#0877a0" stroke-width="2" marker-end="url(#stage-circuit-l-arrow)"/>
      <text x="180" y="57" text-anchor="middle" class="stage-circuit-symbol">i<tspan baseline-shift="sub" font-size="70%">H</tspan></text><text x="650" y="57" text-anchor="middle" class="stage-circuit-symbol">i<tspan baseline-shift="sub" font-size="70%">L</tspan></text>
      <text x="180" y="101" text-anchor="middle" class="stage-circuit-value">0.000 pu (0.0 A)</text>
      <text x="650" y="101" text-anchor="middle" class="stage-circuit-value">0.000 pu (0.0 A)</text>
      <text x="293" y="113" text-anchor="middle" class="stage-circuit-symbol">z<tspan baseline-shift="sub" font-size="70%">eq</tspan></text>
      <text x="293" y="192" text-anchor="middle" class="stage-circuit-value">0.010 + j0.150 pu</text>
      <text x="293" y="215" text-anchor="middle" class="stage-circuit-value">折算至高压侧的串联阻抗</text>
      <text x="500" y="65" text-anchor="middle" class="stage-circuit-symbol">τe<tspan baseline-shift="super" font-size="70%">j30°</tspan> : 1</text>
      <text x="500" y="90" text-anchor="middle" class="stage-circuit-value">τ = 1.000</text>
      <text x="500" y="113" text-anchor="middle" class="stage-circuit-value">标幺理想变压器</text>
      <text x="82" y="149" text-anchor="middle" class="stage-circuit-symbol">+</text><text x="82" y="273" text-anchor="middle" class="stage-circuit-symbol">−</text><text x="82" y="207" text-anchor="middle" class="stage-circuit-symbol">v<tspan baseline-shift="sub" font-size="70%">H</tspan></text>
      <text x="751" y="149" text-anchor="middle" class="stage-circuit-symbol">+</text><text x="751" y="273" text-anchor="middle" class="stage-circuit-symbol">−</text><text x="751" y="207" text-anchor="middle" class="stage-circuit-symbol">v<tspan baseline-shift="sub" font-size="70%">L</tspan></text>
      <text x="225" y="298" text-anchor="middle" class="stage-circuit-value">vH = 1.000∠0° pu</text>
      <text x="625" y="298" text-anchor="middle" class="stage-circuit-value">vL = 1.000∠-30.0° pu</text>
      <text x="225" y="320" text-anchor="middle" class="stage-circuit-value">高压线电压：138.000 kV</text>
      <text x="625" y="320" text-anchor="middle" class="stage-circuit-value">低压线电压：13.800 kV</text>
      <text x="400" y="351" text-anchor="middle" class="stage-circuit-value">平衡正序 · 忽略励磁支路 · 保持电压基准不变</text></svg>
