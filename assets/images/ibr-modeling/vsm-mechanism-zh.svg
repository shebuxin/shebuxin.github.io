<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 455" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">相同稳态斜率，不同频率动态</title><desc id="desc">相同稳态斜率，不同频率动态. 课程绘制的结构图或计算响应。</desc>
<defs><marker id="arrow0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17374b"/></marker><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7095"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bd733d"/></marker><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#377e70"/></marker><marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#667c87"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif} .small{font-size:17px} .label{font-size:20px;font-weight:600} .note{font-size:18px} .title{font-size:26px;font-weight:600}</style>
<rect width="1040" height="455" rx="18" fill="#fbfcfc"/>
<text x="35" y="53" font-size="18" fill="#2f7095" text-anchor="start" font-weight="600">代数式下垂</text>
<rect x="35" y="88" width="270" height="94" rx="10" fill="#fff" stroke="#2f7095"/>
<text x="170.0" y="118" font-size="20" fill="#2f7095" text-anchor="middle" font-weight="600">P* − P_f</text>
<text x="170.0" y="166" font-size="16" fill="#667c87" text-anchor="middle" font-weight="400">滤波后的功率偏差</text>
<rect x="410" y="88" width="315" height="94" rx="10" fill="#fff" stroke="#2f7095"/>
<text x="567.5" y="118" font-size="20" fill="#2f7095" text-anchor="middle" font-weight="600">1 + m_p(·)</text>
<text x="567.5" y="166" font-size="16" fill="#667c87" text-anchor="middle" font-weight="400">瞬时频率规律</text>
<path d="M305 135L400 135" fill="none" stroke="#2f7095" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow1)"/>
<path d="M725 135L941 135" fill="none" stroke="#2f7095" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow1)"/>
<text x="965" y="142" font-size="25" fill="#2f7095" text-anchor="start" font-weight="400">ω</text>
<text x="35" y="245" font-size="18" fill="#377e70" text-anchor="start" font-weight="600">虚拟同步机</text>
<rect x="35" y="275" width="270" height="94" rx="10" fill="#fff" stroke="#377e70"/>
<text x="170.0" y="305" font-size="20" fill="#377e70" text-anchor="middle" font-weight="600">P* − P_f − D(ω − 1)</text>
<text x="170.0" y="353" font-size="16" fill="#667c87" text-anchor="middle" font-weight="400">加速功率</text>
<rect x="410" y="275" width="315" height="94" rx="10" fill="#fff" stroke="#377e70"/>
<text x="567.5" y="305" font-size="20" fill="#377e70" text-anchor="middle" font-weight="600">1 / (M s)</text>
<text x="567.5" y="353" font-size="16" fill="#667c87" text-anchor="middle" font-weight="400">频率成为独立状态</text>
<path d="M305 322L400 322" fill="none" stroke="#377e70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow3)"/>
<path d="M725 322L941 322" fill="none" stroke="#377e70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow3)"/>
<text x="965" y="329" font-size="25" fill="#377e70" text-anchor="start" font-weight="400">ω</text>
<text x="32" y="431" font-size="17" fill="#667c87" text-anchor="start" font-weight="400">D = 1/m_p 保持相同稳态斜率；M 改变初始频率变化率。</text>
</svg>
