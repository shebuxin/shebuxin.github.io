<div class="bf-control uf-control"><label for="uf-{{ include.control.key }}">{% if page.lang == 'zh' %}{{ include.control.zh }}{% else %}{{ include.control.en }}{% endif %}<output for="uf-{{ include.control.key }}" data-value="{{ include.control.key }}">{{ include.control.value }} {{ include.control.unit }}</output></label><input id="uf-{{ include.control.key }}" type="range" data-key="{{ include.control.key }}" data-unit="{{ include.control.unit }}" min="{{ include.control.min }}" max="{{ include.control.max }}" step="{{ include.control.step }}" value="{{ include.control.value }}"></div>
