{% assign pf_zh = false %}{% if page.lang == 'zh' %}{% assign pf_zh = true %}{% endif %}
{% assign pf_id = include.kind | prepend: 'concept-' %}
<figure class="pf-concept" id="{{ pf_id }}" aria-labelledby="{{ pf_id }}-title">
{% case include.kind %}
{% when 'admittance' %}
  <h4 id="{{ pf_id }}-title">{% if pf_zh %}从一条线路到整个 Y 矩阵{% else %}From one branch to the full Y matrix{% endif %}</h4>
  <p class="pf-intro">{% if pf_zh %}先看线路两端的电流，再把它对两个节点的贡献写入矩阵。这里的 i、j、k 是通用节点符号。{% else %}Start with the current at each end of a branch, then place its contributions in the matrix. Here i, j, and k are generic bus labels.{% endif %}</p>
  <p class="pf-notation">{% if pf_zh %}<strong>先区分符号：</strong>小写 <i>y</i><sub>ij</sub> = 1/<i>z</i><sub>ij</sub> 是线路 i–j 的串联导纳；大写 <i>Y</i><sub>ii</sub> 是节点 i 的自导纳，大写 <i>Y</i><sub>ij</sub> 是节点导纳矩阵的非对角元素。下面每格先标元素名称，再写它的值。{% else %}<strong>Distinguish the symbols:</strong> lowercase <i>y</i><sub>ij</sub> = 1/<i>z</i><sub>ij</sub> is the series admittance of branch i–j. Uppercase <i>Y</i><sub>ii</sub> is bus i's self-admittance; <i>Y</i><sub>ij</sub> is an off-diagonal entry of the bus admittance matrix. Each cell below shows the entry name followed by its value.{% endif %}</p>
  <div data-admittance-diagram data-lang="{% if pf_zh %}zh{% else %}en{% endif %}">
    <div class="pf-controls" role="group" aria-label="{% if pf_zh %}选择要跟踪的线路{% else %}Choose a branch to trace{% endif %}"><span class="pf-control-label">{% if pf_zh %}跟踪线路{% else %}Trace branch{% endif %}</span><button type="button" data-trace="ij" aria-pressed="true">i–j</button><button type="button" data-trace="jk" aria-pressed="false">j–k</button><button type="button" data-trace="ik" aria-pressed="false">i–k</button></div>
    <div class="pf-panels">
      <section class="pf-panel"><h5>{% if pf_zh %}1 · 网络与线路状态{% else %}1 · Network and branch status{% endif %}</h5>
        <svg class="pf-svg" viewBox="0 0 420 225" role="img" aria-label="{% if pf_zh %}通用三节点网络，选中线路与开断状态随控制更新{% else %}Generic three-bus graph with the traced branch and open branches highlighted{% endif %}">
          <path class="pf-wire is-selected" data-branch-line="ij" d="M 90 140 H 185"/><path class="pf-wire" data-branch-line="jk" d="M 235 140 H 330"/><path class="pf-wire is-open" data-branch-line="ik" d="M 82 120 Q 210 -10 338 120"/>
          <text x="137" y="112" text-anchor="middle" data-branch-label="ij">yᵢⱼ</text><text x="283" y="112" text-anchor="middle" data-branch-label="jk">yⱼₖ</text><text x="210" y="35" text-anchor="middle" data-branch-label="ik">yᵢₖ</text>
          <circle class="pf-node" cx="65" cy="140" r="25"/><circle class="pf-node" cx="210" cy="140" r="25"/><circle class="pf-node" cx="355" cy="140" r="25"/>
          <text class="pf-node-label" x="65" y="148" text-anchor="middle">i</text><text class="pf-node-label" x="210" y="148" text-anchor="middle">j</text><text class="pf-node-label" x="355" y="148" text-anchor="middle">k</text>
          <text x="65" y="193" text-anchor="middle">Vᵢ</text><text x="210" y="193" text-anchor="middle">Vⱼ</text><text x="355" y="193" text-anchor="middle">Vₖ</text>
        </svg>
        <fieldset><legend>{% if pf_zh %}勾选表示线路接通{% else %}Checked branches are connected{% endif %}</legend><label><input type="checkbox" data-connected="ij" checked> i–j</label><label><input type="checkbox" data-connected="jk" checked> j–k</label><label><input type="checkbox" data-connected="ik"> i–k</label></fieldset>
        <div class="pf-formula" data-branch-equation>Iᵢⱼ = yᵢⱼ (Vᵢ − Vⱼ)</div>
      </section>
      <section class="pf-panel"><h5>{% if pf_zh %}2 · 这条线路对 Y 的贡献（ΔY）{% else %}2 · This branch's contribution to Y (ΔY){% endif %}</h5>
        <table class="pf-matrix pf-stamp" aria-label="{% if pf_zh %}选中线路的二乘二导纳贡献{% else %}Two-by-two admittance contribution of the traced branch{% endif %}"><thead><tr><th></th><th scope="col" data-stamp-bus="a">i</th><th scope="col" data-stamp-bus="b">j</th></tr></thead><tbody><tr><th scope="row" data-stamp-bus="a">i</th><td data-stamp-cell="positive" data-stamp-row="a" data-stamp-column="a"><span class="pf-entry-name">Δ<i>Y</i><sub data-stamp-index>ii</sub></span><span class="pf-entry-value" data-stamp-value>= + yᵢⱼ</span></td><td data-stamp-cell="negative" data-stamp-row="a" data-stamp-column="b"><span class="pf-entry-name">Δ<i>Y</i><sub data-stamp-index>ij</sub></span><span class="pf-entry-value" data-stamp-value>= − yᵢⱼ</span></td></tr><tr><th scope="row" data-stamp-bus="b">j</th><td data-stamp-cell="negative" data-stamp-row="b" data-stamp-column="a"><span class="pf-entry-name">Δ<i>Y</i><sub data-stamp-index>ji</sub></span><span class="pf-entry-value" data-stamp-value>= − yᵢⱼ</span></td><td data-stamp-cell="positive" data-stamp-row="b" data-stamp-column="b"><span class="pf-entry-name">Δ<i>Y</i><sub data-stamp-index>jj</sub></span><span class="pf-entry-value" data-stamp-value>= + yᵢⱼ</span></td></tr></tbody></table>
        <p>{% if pf_zh %}ΔY 表示这条线路对矩阵的增量。展开两端电流方程，这条线路为两端的自导纳各加上 +y，为两个对应的非对角元素各加上 −y；完整 Y 还需累加其他接通线路的贡献。{% else %}ΔY is this branch's increment to the matrix. Expanding the two end-current equations adds +y to each end's self-admittance and −y to the two corresponding off-diagonal entries. The full Y also includes contributions from the other connected branches.{% endif %}</p>
        <p class="pf-note" data-stamp-note role="status" aria-live="polite"></p>
      </section>
    </div>
    <section class="pf-panel" style="margin-top:1rem"><h5>{% if pf_zh %}3 · 把接通线路的贡献相加{% else %}3 · Add the connected branches{% endif %}</h5>
      <table class="pf-matrix" aria-label="{% if pf_zh %}三乘三节点导纳矩阵，随线路状态更新{% else %}Three-by-three bus admittance matrix updated from branch status{% endif %}"><thead><tr><th>Y</th><th scope="col">i</th><th scope="col">j</th><th scope="col">k</th></tr></thead><tbody><tr><th scope="row">i</th><td data-y-cell="0,0" data-diagonal><span class="pf-entry-name"><i>Y</i><sub>ii</sub></span><span class="pf-entry-value" data-y-value>= yᵢⱼ</span></td><td data-y-cell="0,1"><span class="pf-entry-name"><i>Y</i><sub>ij</sub></span><span class="pf-entry-value" data-y-value>= − yᵢⱼ</span></td><td data-y-cell="0,2"><span class="pf-entry-name"><i>Y</i><sub>ik</sub></span><span class="pf-entry-value" data-y-value>= 0</span></td></tr><tr><th scope="row">j</th><td data-y-cell="1,0"><span class="pf-entry-name"><i>Y</i><sub>ji</sub></span><span class="pf-entry-value" data-y-value>= − yᵢⱼ</span></td><td data-y-cell="1,1" data-diagonal><span class="pf-entry-name"><i>Y</i><sub>jj</sub></span><span class="pf-entry-value" data-y-value>= yᵢⱼ + yⱼₖ</span></td><td data-y-cell="1,2"><span class="pf-entry-name"><i>Y</i><sub>jk</sub></span><span class="pf-entry-value" data-y-value>= − yⱼₖ</span></td></tr><tr><th scope="row">k</th><td data-y-cell="2,0"><span class="pf-entry-name"><i>Y</i><sub>ki</sub></span><span class="pf-entry-value" data-y-value>= 0</span></td><td data-y-cell="2,1"><span class="pf-entry-name"><i>Y</i><sub>kj</sub></span><span class="pf-entry-value" data-y-value>= − yⱼₖ</span></td><td data-y-cell="2,2" data-diagonal><span class="pf-entry-name"><i>Y</i><sub>kk</sub></span><span class="pf-entry-value" data-y-value>= yⱼₖ</span></td></tr></tbody></table>
      <p>{% if pf_zh %}浅蓝色对角元素是自导纳，如 Y<sub>ii</sub>；其值累加节点 i 所有接通线路的导纳。只有 i–j 接通时，Y<sub>ii</sub> = y<sub>ij</sub>；再接通 i–k，就变为 Y<sub>ii</sub> = y<sub>ij</sub> + y<sub>ik</sub>。橙色只标出正在跟踪的线路贡献。{% else %}Pale-blue diagonal entries are self-admittances, such as Y<sub>ii</sub>; their values sum all connected branch admittances at that bus. With only i–j connected, Y<sub>ii</sub> = y<sub>ij</sub>. Connecting i–k gives Y<sub>ii</sub> = y<sub>ij</sub> + y<sub>ik</sub>. Orange marks only the traced branch's contribution.{% endif %}</p>
    </section>
    <noscript>{% if pf_zh %}图中展示 i–j、j–k 接通的矩阵；启用 JavaScript 后可以切换线路。{% else %}The diagram shows i–j and j–k connected. Enable JavaScript to change the branches.{% endif %}</noscript>
  </div>
  <figcaption>{% if pf_zh %}本图只含串联线路，忽略并联导纳与变压器：自导纳 Y<sub>ii</sub> = Σ y<sub>iℓ</sub>（对接通线路求和）；非对角元素 Y<sub>ij</sub> = −y<sub>ij</sub>，没有接通的直接线路时为零。+、− 表示复数导纳的代数系数，不是其数值的正负。{% else %}This series-only diagram omits shunts and transformers: self-admittance Y<sub>ii</sub> = Σ y<sub>iℓ</sub> over connected branches; off-diagonal Y<sub>ij</sub> = −y<sub>ij</sub>, or zero with no connected direct branch. + and − are algebraic coefficients of complex admittances, not signs of their numerical values.{% endif %}</figcaption>
{% when 'injection' %}
  <h4 id="{{ pf_id }}-title">{% if pf_zh %}把发电和负荷合并为节点净注入{% else %}Combine generation and demand into net bus injection{% endif %}</h4>
  <div class="pf-scroll" tabindex="0" aria-label="{% if pf_zh %}教学示意图，可横向滚动{% else %}Teaching diagram, scroll horizontally{% endif %}"><svg class="pf-svg pf-wide" viewBox="0 0 640 230" role="img" aria-label="{% if pf_zh %}发电进入节点，负荷从节点取电，剩余净注入进入网络{% else %}Generation enters a bus, demand leaves it, and net injection enters the network{% endif %}">
    <rect class="pf-device" x="18" y="65" width="140" height="80" rx="8"/><text x="88" y="98" text-anchor="middle">{% if pf_zh %}分布式电源{% else %}Generation{% endif %}</text><text x="88" y="125" text-anchor="middle">Pɢ , Qɢ</text>
    <path class="pf-arrow" d="M 160 105 H 278"/><polygon class="pf-arrow-head" points="278,105 266,99 266,111"/>
    <circle class="pf-node" cx="320" cy="105" r="32"/><text class="pf-node-label" x="320" y="114" text-anchor="middle">i</text>
    <path class="pf-arrow" d="M 354 105 H 480"/><polygon class="pf-arrow-head" points="480,105 468,99 468,111"/>
    <rect class="pf-device" x="482" y="65" width="140" height="80" rx="8"/><text x="552" y="98" text-anchor="middle">{% if pf_zh %}负荷{% else %}Demand{% endif %}</text><text x="552" y="125" text-anchor="middle">Pᴅ , Qᴅ</text>
    <path class="pf-arrow" d="M 320 138 V 190"/><polygon class="pf-arrow-head" points="320,190 314,178 326,178"/><text x="345" y="173">{% if pf_zh %}净注入网络{% else %}Net to network{% endif %}</text><text x="320" y="220" text-anchor="middle">Pˢᵖᵉᶜ = Pɢ − Pᴅ , Qˢᵖᵉᶜ = Qɢ − Qᴅ</text>
  </svg></div>
  <figcaption>{% if pf_zh %}箭头定义功率的正方向。若发电少于负荷，净注入为负，网络向该节点供电。P 和 Q 分别计算：增加有功发电并不会自动抵消无功需求。{% else %}Arrows define the positive directions. When demand exceeds generation, net injection is negative and the network supplies the bus. Compute P and Q separately: active generation does not automatically offset reactive demand.{% endif %}</figcaption>
{% when 'newton' %}
  <h4 id="{{ pf_id }}-title">{% if pf_zh %}一次牛顿迭代在做什么？{% else %}What happens in a Newton iteration?{% endif %}</h4>
  <ol class="pf-flow"><li><strong>{% if pf_zh %}初始化电压{% else %}Initialize voltages{% endif %}</strong>{% if pf_zh %}给出 PQ 节点幅值和相角的初始估计。{% else %}Choose initial PQ voltage magnitudes and angles.{% endif %}<code>x⁽⁰⁾ = [θ, v]</code></li><li><strong>{% if pf_zh %}计算功率偏差{% else %}Calculate mismatch{% endif %}</strong>{% if pf_zh %}由当前 V 和 Y 算出 P、Q，再与指定量比较。{% else %}Use V and Y to calculate P/Q and compare with the specifications.{% endif %}<code>Δs = sˢᵖᵉᶜ − s(x)</code></li><li><strong>{% if pf_zh %}检查是否收敛{% else %}Check convergence{% endif %}</strong>{% if pf_zh %}最大偏差是否小于容差？满足则输出电压；否则继续。{% else %}Is the largest mismatch below tolerance? If yes, return voltages; otherwise continue.{% endif %}<code>‖Δs‖∞ &lt; ε ?</code></li><li><strong>{% if pf_zh %}求解并更新{% else %}Solve and update{% endif %}</strong>{% if pf_zh %}用雅可比计算修正量，再用步长 α 更新。{% else %}Use the Jacobian for the correction, then apply step size α.{% endif %}<code>J Δx = Δs</code><code>x ← x + α Δx</code></li></ol>
  <div class="pf-paths"><span class="pf-path pf-path--success">{% if pf_zh %}步骤 3 满足容差 → 输出电压，计算线路功率{% else %}Step 3 meets tolerance → return V and calculate branch flows{% endif %}</span><span class="pf-path">{% if pf_zh %}步骤 4 更新后 ↩ 返回步骤 2{% else %}After step 4 ↩ return to step 2{% endif %}</span></div>
  <figcaption>{% if pf_zh %}每轮都重新计算功率偏差和雅可比。达到迭代上限或步长停滞时，算法报告未收敛；这与解收敛后检查电压、电流限值是两个不同步骤。{% else %}Recompute the mismatch and Jacobian each round. A stalled step or iteration limit ends the algorithm without convergence. Operating-limit checks are performed separately on a converged result.{% endif %}</figcaption>
{% when 'feeder' %}
  <h4 id="{{ pf_id }}-title">{% if pf_zh %}例题网络：参考电源、两个 PQ 节点与联络线{% else %}Example network: a reference source, two PQ buses, and a tie{% endif %}</h4>
  <div class="pf-scroll" tabindex="0" aria-label="{% if pf_zh %}教学示意图，可横向滚动{% else %}Teaching diagram, scroll horizontally{% endif %}"><svg class="pf-svg pf-wide" viewBox="0 0 660 300" role="img" aria-label="{% if pf_zh %}节点1经线路1–2和2–3向负荷供电；1–3联络线常开；节点3连接分布式电源{% else %}Bus 1 supplies buses 2 and 3 through radial branches; tie 1–3 is open and bus 3 has distributed generation{% endif %}">
    <path class="pf-wire" d="M 100 130 H 300 M 360 130 H 560"/><path class="pf-wire" stroke-dasharray="8 6" d="M 92 109 Q 330 -15 568 109"/>
    <text x="330" y="36" text-anchor="middle">{% if pf_zh %}1–3 联络线：常开{% else %}1–3 tie: normally open{% endif %}</text><text x="210" y="105" text-anchor="middle">z₁₂</text><text x="450" y="105" text-anchor="middle">z₂₃</text>
    <circle class="pf-source" cx="70" cy="130" r="30"/><circle class="pf-node" cx="330" cy="130" r="30"/><circle class="pf-node" cx="590" cy="130" r="30"/>
    <text class="pf-node-label" x="70" y="139" text-anchor="middle">1</text><text class="pf-node-label" x="330" y="139" text-anchor="middle">2</text><text class="pf-node-label" x="590" y="139" text-anchor="middle">3</text>
    <text x="70" y="185" text-anchor="middle">1∠0° pu</text><text x="70" y="215" text-anchor="middle">{% if pf_zh %}参考电源{% else %}Reference{% endif %}</text>
    <path class="pf-wire" d="M 330 160 V 195 M 590 160 V 195"/><rect class="pf-device" x="248" y="195" width="164" height="85" rx="7"/><rect class="pf-device" x="508" y="195" width="144" height="85" rx="7"/>
    <text x="330" y="225" text-anchor="middle">{% if pf_zh %}负荷 120 kW{% else %}Load 120 kW{% endif %}</text><text class="pf-small" x="330" y="254" text-anchor="middle">PF = 0.95</text><text x="580" y="222" text-anchor="middle">{% if pf_zh %}负荷 180 kW{% else %}Load 180 kW{% endif %}</text><text class="pf-small" x="580" y="249" text-anchor="middle">DG 50 kW</text><text class="pf-small" x="580" y="273" text-anchor="middle">Qɢ = 0</text>
  </svg></div>
  <p class="pf-scroll-hint">{% if pf_zh %}左右滑动查看完整示意图。{% else %}Swipe sideways to see the full diagram.{% endif %}</p>
  <figcaption>{% if pf_zh %}实线形成 1 → 2 → 3 的辐射型馈线，虚线是备用联络线。节点 3 的负荷和发电在同一节点合并为净 PQ 注入；后面的实验可改变出力并闭合联络线。{% else %}Solid branches form the radial 1 → 2 → 3 feeder; the dashed branch is the spare tie. Combine demand and generation at bus 3 as a net PQ injection. The experiment later changes generation and closes the tie.{% endif %}</figcaption>
{% when 'neutral' %}
  <h4 id="{{ pf_id }}-title">{% if pf_zh %}负荷端电压由相线和当地中性点共同决定{% else %}Load voltage depends on both the phase and local neutral{% endif %}</h4>
  <div class="pf-scroll" tabindex="0" aria-label="{% if pf_zh %}教学示意图，可横向滚动{% else %}Teaching diagram, scroll horizontally{% endif %}"><svg class="pf-svg pf-wide" viewBox="0 0 640 365" role="img" aria-label="{% if pf_zh %}三相四线支路、星形负荷与共享中性线回流，仅电源中性点接地{% else %}Four-wire branch with wye loads and a shared neutral return; only the source neutral is grounded{% endif %}">
    <rect x="162" y="40" width="135" height="291" rx="8" fill="#edf3f8"/><text x="230" y="25" text-anchor="middle">{% if pf_zh %}线路 Z（4×4）{% else %}Line Z (4×4){% endif %}</text>
    <path d="M 60 75 H 400 M 60 145 H 460 M 60 215 H 520" stroke="#2571a2" stroke-width="3" fill="none"/><path d="M 60 315 H 540 V 285 H 400" stroke="#697482" stroke-width="3" fill="none"/>
    <text x="30" y="81" text-anchor="middle">a</text><text x="30" y="151" text-anchor="middle">b</text><text x="30" y="221" text-anchor="middle">c</text><text x="30" y="321" text-anchor="middle">n</text>
    <path class="pf-wire" d="M 400 75 V 245 M 460 145 V 245 M 520 215 V 245 M 400 280 V 285 M 460 280 V 285 M 520 280 V 285"/>
    <rect class="pf-device" x="386" y="245" width="28" height="35"/><rect class="pf-device" x="446" y="245" width="28" height="35"/><rect class="pf-device" x="506" y="245" width="28" height="35"/>
    <circle cx="400" cy="75" r="5" fill="#2571a2"/><circle cx="460" cy="145" r="5" fill="#2571a2"/><circle cx="520" cy="215" r="5" fill="#2571a2"/>
    <text x="414" y="65">Vⱼ,ₐ</text><text x="474" y="135">Vⱼ,ᵦ</text><text x="534" y="205">Vⱼ,𝒸</text><text x="547" y="319">Vⱼ,ₙ</text>
    <path d="M 60 315 V 342 M 43 342 H 77 M 48 351 H 72 M 54 360 H 66" stroke="#697482" stroke-width="2" fill="none"/><text class="pf-small" x="92" y="357">Vᵢ,ₙ = 0</text>
    <path class="pf-arrow" d="M 95 55 H 145"/><polygon class="pf-arrow-head" points="145,55 133,49 133,61"/><text class="pf-small" x="120" y="42" text-anchor="middle">Iₐ</text>
    <path d="M 320 338 H 370" stroke="#697482" stroke-width="3"/><polygon points="370,338 358,332 358,344" fill="#697482"/><text class="pf-small" x="350" y="360" text-anchor="middle">Iₙ = −Σ Iφ</text>
    <path d="M 575 75 V 285 M 568 75 H 582 M 568 285 H 582" stroke="#27785f" stroke-width="2" fill="none"/><text x="598" y="113" text-anchor="middle">Uⱼ,ₐ</text>
  </svg></div>
  <p class="pf-scroll-hint">{% if pf_zh %}左右滑动查看完整示意图。{% else %}Swipe sideways to see the full diagram.{% endif %}</p>
  <div class="pf-panels" style="margin-top:1rem"><section class="pf-panel"><h5>{% if pf_zh %}电压差也是相量差{% else %}A voltage difference is a phasor difference{% endif %}</h5>
    <svg class="pf-svg" viewBox="0 0 370 235" role="img" aria-label="{% if pf_zh %}从当地中性点电压相量的端点，指向相线电压相量端点的矢量，就是负荷端电压{% else %}The vector from the neutral-voltage tip to the phase-voltage tip is the load-terminal voltage{% endif %}">
      <path d="M 65 185 H 330 M 85 205 V 25" stroke="#d1dce5" stroke-width="2"/><text class="pf-small" x="332" y="206">Re</text><text class="pf-small" x="55" y="28">Im</text><text class="pf-small" x="66" y="205">0</text>
      <path class="pf-arrow" d="M 85 185 L 280 55"/><polygon class="pf-arrow-head" points="280,55 265,58 272,68"/><text x="286" y="53">Vφ</text>
      <path d="M 85 185 L 145 160" stroke="#b76819" stroke-width="3"/><polygon points="145,160 130,160 135,172" fill="#b76819"/><text x="135" y="188">Vₙ</text>
      <path d="M 145 160 L 280 55" stroke="#27785f" stroke-width="3"/><polygon points="280,55 264,61 272,71" fill="#27785f"/><text x="227" y="131">Uφ</text>
    </svg>
  </section><section class="pf-panel"><h5>{% if pf_zh %}读图的两个关键点{% else %}Two things to notice{% endif %}</h5><p><strong>Uφ = Vφ − Vₙ</strong></p><p>{% if pf_zh %}绿色矢量从当地中性点出发。中性点发生偏移时，即使相线对参考点的电压变化不大，负荷两端的电压也会改变。{% else %}The green vector starts at the local neutral. A shifted neutral changes the load voltage even when the phase-to-reference voltage changes little.{% endif %}</p><p>{% if pf_zh %}中性线电流是三相电流的复相量之和取负，不能把三个电流幅值直接相加。上图的 Z 包含自阻抗和所采用的互耦项。{% else %}Neutral current is the negative phasor sum of the phase currents, not a sum of magnitudes. The line's Z includes its self impedances and the modeled coupling terms.{% endif %}</p></section></div>
  <figcaption>{% if pf_zh %}导线图说明连接关系，相量图说明电压参考；相量长度仅用于示意。导线电流统一以 i → j 为参考方向，因此 Iₙ = −ΣIφ。负荷三个支路共用的当地中性点，通过有限阻抗中性线返回电源，没有另设下游接地。{% else %}The conductor diagram shows connectivity; the phasor diagram shows voltage references. Phasor lengths are illustrative. All conductor currents use i → j as their reference direction, hence Iₙ = −ΣIφ. The shared local neutral returns through finite wire impedance, without downstream grounding.{% endif %}</figcaption>
{% when 'sweep' %}
  <h4 id="{{ pf_id }}-title">{% if pf_zh %}同一条馈线，两个方向的计算{% else %}One feeder, two calculation directions{% endif %}</h4>
  <div class="pf-panels"><section class="pf-panel"><h5>{% if pf_zh %}回代：末端 → 电源{% else %}Backward: end → source{% endif %}</h5><svg class="pf-svg" viewBox="0 0 390 155" role="img" aria-label="{% if pf_zh %}从节点k到j再到i汇总下游电流{% else %}Accumulate downstream currents from k to j to i{% endif %}"><path class="pf-wire" d="M 65 90 H 325"/><path class="pf-arrow" d="M 310 40 H 220 M 180 40 H 80"/><polygon class="pf-arrow-head" points="220,40 232,34 232,46"/><polygon class="pf-arrow-head" points="80,40 92,34 92,46"/><circle class="pf-source" cx="65" cy="90" r="23"/><circle class="pf-node" cx="195" cy="90" r="23"/><circle class="pf-node" cx="325" cy="90" r="23"/><text class="pf-node-label" x="65" y="98" text-anchor="middle">i</text><text class="pf-node-label" x="195" y="98" text-anchor="middle">j</text><text class="pf-node-label" x="325" y="98" text-anchor="middle">k</text><text x="130" y="142" text-anchor="middle">Iᵢⱼ</text><text x="260" y="142" text-anchor="middle">Iⱼₖ</text></svg><div class="pf-formula">Iᵢⱼ = Iⱼˡᵒᵃᵈ + Iⱼₖ</div><p>{% if pf_zh %}先由当前负荷端电压计算各相电流，再从末端汇总。中性线电流也一起传递。{% else %}Calculate load currents from the current terminal voltages, then accumulate them from the end. Carry the neutral current as well.{% endif %}</p></section>
  <section class="pf-panel"><h5>{% if pf_zh %}前推：电源 → 末端{% else %}Forward: source → end{% endif %}</h5><svg class="pf-svg" viewBox="0 0 390 155" role="img" aria-label="{% if pf_zh %}从固定电源电压出发，依次计算j和k的四导线电压{% else %}Start with the fixed source voltage and update the four conductor voltages at j and k{% endif %}"><path class="pf-wire" d="M 65 90 H 325"/><path class="pf-arrow" d="M 80 40 H 180 M 220 40 H 310"/><polygon class="pf-arrow-head" points="180,40 168,34 168,46"/><polygon class="pf-arrow-head" points="310,40 298,34 298,46"/><circle class="pf-source" cx="65" cy="90" r="23"/><circle class="pf-node" cx="195" cy="90" r="23"/><circle class="pf-node" cx="325" cy="90" r="23"/><text class="pf-node-label" x="65" y="98" text-anchor="middle">i</text><text class="pf-node-label" x="195" y="98" text-anchor="middle">j</text><text class="pf-node-label" x="325" y="98" text-anchor="middle">k</text><text x="65" y="142" text-anchor="middle">Vᵢ</text><text x="195" y="142" text-anchor="middle">Vⱼ</text><text x="325" y="142" text-anchor="middle">Vₖ</text></svg><div class="pf-formula">Vⱼ = Vᵢ − Zᵢⱼ Iᵢⱼ</div><p>{% if pf_zh %}用回代得到的支路电流和四乘四阻抗矩阵，沿路径计算电压降。{% else %}Use branch currents from the backward pass and the four-by-four impedance matrix to propagate voltage drops.{% endif %}</p></section></div>
  <figcaption>{% if pf_zh %}箭头表示计算顺序。每个 V、I 都包含 a、b、c、n 四个复数分量。前推得到的新电压经过阻尼更新，再用于下一轮电流计算。{% else %}Arrows show the calculation order. Every V and I contains four complex components: a, b, c, and n. Damp the new voltages from the forward pass, then use them for the next current calculation.{% endif %}</figcaption>
{% when 'mapping' %}
  <h4 id="{{ pf_id }}-title">{% if pf_zh %}沿着电路图找到对应的建模函数{% else %}Follow the circuit into the modeling functions{% endif %}</h4>
  <div class="pf-panels"><section class="pf-panel"><h5>{% if pf_zh %}物理连接{% else %}Physical connections{% endif %}</h5><svg class="pf-svg" viewBox="0 0 380 300" role="img" aria-label="{% if pf_zh %}外部电源经线路连接负荷节点，该节点同时连接负荷和分布式电源{% else %}An external source connects through a line to a bus with demand and distributed generation{% endif %}"><circle class="pf-source" cx="58" cy="55" r="26"/><path d="M 44 55 Q 51 37 58 55 Q 65 73 72 55" stroke="#3971a2" stroke-width="2" fill="none"/><path class="pf-wire" d="M 58 81 V 115 H 270 M 270 115 V 165 M 190 165 H 315 M 190 165 V 195 M 315 165 V 195"/><circle class="pf-node" cx="58" cy="115" r="7"/><circle class="pf-node" cx="270" cy="115" r="7"/><text x="270" y="96" text-anchor="middle">bus</text><text x="165" y="101" text-anchor="middle">line</text><text x="95" y="62">ext_grid</text><rect class="pf-device" x="140" y="195" width="100" height="70" rx="7"/><rect class="pf-device" x="265" y="195" width="100" height="70" rx="7"/><text x="190" y="236" text-anchor="middle">load</text><text x="315" y="236" text-anchor="middle">sgen</text></svg></section>
  <section class="pf-panel"><h5>{% if pf_zh %}设备 → 输入表{% else %}Equipment → input tables{% endif %}</h5><dl class="pf-mapping"><div><dt>{% if pf_zh %}节点与电压基准{% else %}Buses and voltage bases{% endif %}</dt><dd><code>create_bus() → net.bus</code></dd></div><div><dt>{% if pf_zh %}参考电源{% else %}Reference source{% endif %}</dt><dd><code>create_ext_grid() → net.ext_grid</code></dd></div><div><dt>{% if pf_zh %}线路与阻抗{% else %}Branches and impedances{% endif %}</dt><dd><code>create_line_from_parameters() → net.line</code></dd></div><div><dt>{% if pf_zh %}负荷 / 固定 PQ 发电{% else %}Demand / fixed-PQ generation{% endif %}</dt><dd><code>create_load() → net.load</code><br><code>create_sgen() → net.sgen</code></dd></div></dl></section></div>
  <div class="pf-formula" style="margin-top:1rem">net → runpp() / runpp_3ph() → net.res_*</div>
  <figcaption>{% if pf_zh %}建网函数写入设备输入表，求解器据此构造网络方程，结果写入 res_* 表。三相模式沿用这些连接关系，但负荷和发电采用逐相非对称输入表。{% else %}Creation functions populate equipment tables. The solver constructs the network equations and writes res_* tables. Three-phase mode retains the connections but uses phase-specific asymmetric load and generator tables.{% endif %}</figcaption>
{% when 'screening' %}
  <h4 id="{{ pf_id }}-title">{% if pf_zh %}一次退出场景，需要三层检查{% else %}Three checks for each outage scenario{% endif %}</h4>
  <div class="pf-formula">{% if pf_zh %}复制基准工况 → 退出一条线路 → 重新求解{% else %}Copy base case → remove one branch → solve again{% endif %}</div>
  <div class="pf-screen"><div class="pf-screen-row"><div><strong>{% if pf_zh %}1 · 供电连接{% else %}1 · Supply connectivity{% endif %}</strong>{% if pf_zh %}所有节点是否仍有通向参考电源的路径？{% else %}Does every bus retain a path to the reference source?{% endif %}</div><span>→</span><div><strong>{% if pf_zh %}没有路径：记录失供节点{% else %}No path: record unsupplied buses{% endif %}</strong>{% if pf_zh %}失供节点的电压不可作为有效潮流标签。{% else %}Their voltages are not valid solved-voltage labels.{% endif %}</div></div><div class="pf-screen-row"><div><strong>{% if pf_zh %}2 · 求解状态{% else %}2 · Solver outcome{% endif %}</strong>{% if pf_zh %}对有参考电源的网络检查是否收敛。{% else %}Check convergence for the supplied network.{% endif %}</div><span>→</span><div><strong>{% if pf_zh %}未收敛：单独记录结果{% else %}No convergence: keep a separate outcome{% endif %}</strong>{% if pf_zh %}算法失败本身不证明物理无解。{% else %}Solver failure alone does not prove physical infeasibility.{% endif %}</div></div><div class="pf-screen-row"><div><strong>{% if pf_zh %}3 · 运行限值{% else %}3 · Operating limits{% endif %}</strong>{% if pf_zh %}检查电压、线路负载率及三相模式的 VUF。{% else %}Check voltage, line loading, and VUF in three-phase mode.{% endif %}</div><span>→</span><div><strong>{% if pf_zh %}记录满足限值或越限{% else %}Record within limits or violations{% endif %}</strong>{% if pf_zh %}全网供电、已收敛且满足全部教学限值，才标记本例 secure。{% else %}The teaching secure label requires supply, convergence, and all chosen limits.{% endif %}</div></div></div>
  <figcaption>{% if pf_zh %}按顺序分别保留供电状态、算法结果和限值检查。单个 net.converged 标志不能替代这三层信息，也不能说明动态稳定性。{% else %}Keep supply status, solver outcome, and limit checks separately. One net.converged flag cannot replace these three layers or establish dynamic stability.{% endif %}</figcaption>
{% endcase %}
