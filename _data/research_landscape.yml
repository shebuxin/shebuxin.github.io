visions:
  physical-systems:
    source_id: "VIS-001"
    short_title:
      en: "IBR-Dominant Power Systems"
      zh: "IBR 主导电力系统"
    title:
      en: "Control and Optimization of IBR-Dominant Power Systems"
      zh: "IBR 主导电力系统的控制与优化"
    summary:
      en: "Develop unified models, stability boundaries, controls, and optimization methods that connect fast IBR dynamics to secure, resilient, and economically efficient system decisions."
      zh: "建立统一的模型、稳定边界、控制与优化方法，将 IBR 快速动态与安全、韧性和经济高效的系统级决策连接起来。"
    keywords:
      en:
        - "Inverter-Based Resources"
        - "Dynamic Stability"
        - "Control and Optimization"
        - "Dynamic Security"
      zh:
        - "逆变器型资源"
        - "动态稳定性"
        - "控制与优化"
        - "动态安全"
    theme_ids:
      - "ibr-dynamics"
      - "operating-boundaries"
      - "dynamic-decisions"
      - "resilience-security"
  intelligent-systems:
    source_id: "VIS-002"
    short_title:
      en: "AI-Driven Intelligent Power Systems"
      zh: "AI 驱动的智能电力系统"
    title:
      en: "AI-Driven Intelligent Power Systems"
      zh: "AI 驱动的智能电力系统"
    summary:
      en: "Develop physics-informed and verifiable AI models and agents for power-system prediction, control, optimization, engineering execution, and grid–AI infrastructure coordination."
      zh: "发展物理可信、可验证的 AI 模型与智能体，服务于电力系统预测、控制、优化、工程执行及电网–AI 基础设施协同。"
    keywords:
      en:
        - "Physics-Informed AI"
        - "Verifiable AI"
        - "Engineering Agents"
        - "Grid–AI Co-Design"
      zh:
        - "物理信息 AI"
        - "可验证 AI"
        - "工程智能体"
        - "电网–AI 协同设计"
    theme_ids:
      - "trustworthy-ai"
      - "engineering-agents"
      - "decision-intelligence"
      - "ai-infrastructure"

