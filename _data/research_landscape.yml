themes:
  ibr-dynamics:
    source_id: "THM-001"
    vision: "physical-systems"
    title:
      en: "IBR Modeling, Control, and Stability"
      zh: "IBR 建模、控制与稳定性"
    short_title:
      en: "IBR Dynamics, Control & Stability"
      zh: "IBR 动态、控制与稳定性"
    summary:
      en: "Develop decision-compatible dynamic models, stability certificates, and coordinated or adaptive control methods for heterogeneous IBRs and hybrid AC/DC systems."
      zh: "面向异构 IBR 与交直流混联系统，发展可服务于决策的动态模型、稳定性认证以及协调与自适应控制方法。"
    keywords:
      en: ["Dynamic Modeling", "Stability Certification", "Grid-Forming Control", "Adaptive Control"]
      zh: ["动态建模", "稳定性认证", "构网型控制", "自适应控制"]
    questions:
      - en: "Decision-compatible dynamic representation"
        zh: "可服务于决策的动态表征"
      - en: "Stability characterization and certification"
        zh: "稳定性表征与认证"
      - en: "Coordinated and adaptive IBR control"
        zh: "IBR 协调与自适应控制"
    evidence:
      - source_id: "WRK-005"
        title: "Hybrid Symbolic-Numerical Modeling and Parametric Stability Analysis of DC-AC Power Systems"
        year: "2026"
        venue: "IEEE Open Access Journal of Power and Energy"
        url: "https://doi.org/10.1109/OAJPE.2026.3666135"
      - source_id: "WRK-029"
        title: "Systematic Controller Design for Inverter-Based Microgrids With Certified Large-Signal Stability and Domain of Attraction"
        year: "2024"
        venue: "IEEE Transactions on Smart Grid"
        url: "https://doi.org/10.1109/TSG.2023.3330705"

  operating-boundaries:
    source_id: "THM-003"
    vision: "physical-systems"
    title:
      en: "Network Operating Boundaries and Resource Capability"
      zh: "网络运行边界与资源能力"
    short_title:
      en: "Operating Boundaries & Capability"
      zh: "运行边界与资源能力"
    summary:
      en: "Characterize the geometry, computation, and limiting mechanisms of feasible regions, security regions, and network capability curves, and translate them into planning and operating constraints."
      zh: "刻画可行域、安全域和网络能力曲线的几何结构、计算方法与限制机理，并将其转化为规划和运行约束。"
    keywords:
      en: ["Operating Boundaries", "Security Regions", "Capability Curves", "Boundary-Aware Decisions"]
      zh: ["运行边界", "安全域", "能力曲线", "边界感知决策"]
    questions:
      - en: "Geometry and certification of feasible regions"
        zh: "可行域的几何结构与认证"
      - en: "Network capability curves and limiting mechanisms"
        zh: "网络能力曲线与限制机理"
      - en: "Boundary-aware planning and operation"
        zh: "边界感知的规划与运行"
    evidence:
      - source_id: "WRK-038"
        title: "Operational boundary of flow network"
        year: "2023"
        venue: "Reliability Engineering & System Safety"
        url: "https://doi.org/10.1016/j.ress.2022.108974"
      - source_id: "WRK-059"
        title: "Boundary supply capability for distribution systems: concept, indices and calculation"
        year: "2018"
        venue: "IET Generation, Transmission & Distribution"
        url: "https://doi.org/10.1049/iet-gtd.2017.0725"

  dynamic-decisions:
    source_id: "THM-002"
    vision: "physical-systems"
    title:
      en: "Dynamic-Security-Constrained Decisions"
      zh: "动态安全约束决策"
    short_title:
      en: "Dynamic-Security Decisions"
      zh: "动态安全决策"
    summary:
      en: "Embed fast dynamics, stability constraints, and controllable device capabilities into operation, scheduling, planning, co-design, and market decisions."
      zh: "将快速动态、稳定约束和设备可控能力嵌入运行、调度、规划、协同设计与市场决策。"
    keywords:
      en: ["Dynamic Security", "Stability-Constrained Optimization", "Virtual Inertia Scheduling", "Market Design"]
      zh: ["动态安全", "稳定约束优化", "虚拟惯量调度", "市场设计"]
    questions:
      - en: "Bridging fast dynamics and system-level decisions"
        zh: "连接快速动态与系统级决策"
      - en: "Dynamic-security-constrained operation and planning"
        zh: "动态安全约束下的运行与规划"
      - en: "Co-design across assets, controls, and operations"
        zh: "资产、控制与运行的协同设计"
      - en: "Economic value and market representation of stability"
        zh: "稳定性的经济价值与市场表达"
      - en: "Economic flows and dynamic market design"
        zh: "经济流与动态市场设计"
    evidence:
      - source_id: "WRK-014"
        title: "Dynamics-Incorporated Modeling Framework for Stability Constrained Scheduling Under High-Penetration of Renewable Energy"
        year: "2025"
        venue: "IEEE Transactions on Sustainable Energy"
        url: "https://doi.org/10.1109/TSTE.2025.3528027"
      - source_id: "WRK-030"
        title: "Virtual Inertia Scheduling (VIS) for Real-Time Economic Dispatch of IBR-Penetrated Power Systems"
        year: "2024"
        venue: "IEEE Transactions on Sustainable Energy"
        url: "https://doi.org/10.1109/TSTE.2023.3319307"

  resilience-security:
    source_id: "THM-004"
    vision: "physical-systems"
    title:
      en: "Resilience and Cyber-Physical Security"
      zh: "韧性与网络物理安全"
    short_title:
      en: "Resilience & Cyber-Physical Security"
      zh: "韧性与网络物理安全"
    summary:
      en: "Quantify system resilience through reproducible event evidence and develop cyber-defense, extreme-event operation, and restoration methods tied to physical outcomes."
      zh: "通过可复现的事件证据量化系统韧性，并发展与物理后果相联系的网络防御、极端事件运行和恢复方法。"
    keywords:
      en: ["Resilience Metrics", "Cyber-Physical Security", "Extreme Events", "Restoration"]
      zh: ["韧性度量", "网络物理安全", "极端事件", "系统恢复"]
    questions:
      - en: "Resilience measurement grounded in event evidence"
        zh: "基于事件证据的韧性度量"
      - en: "Cyber-physical monitoring and defense"
        zh: "网络物理监测与防御"
      - en: "Extreme-event operation and restoration"
        zh: "极端事件下的运行与恢复"
    evidence:
      - source_id: "WRK-002"
        title: "A Review of Energy Storage for Power System Resilience: Functions, Metrics, and Applications"
        year: "2026"
        venue: "Applied Energy"
        url: "https://doi.org/10.1016/j.apenergy.2026.128056"
      - source_id: "WRK-001"
        title: "Graph-Theoretic Meter Encoding for Detecting False Data Injection Attacks in Partially Measured Transmission Systems"
        year: "2026"
        venue: "IEEE Transactions on Smart Grid"
        url: "https://doi.org/10.1109/TSG.2026.3711001"

  trustworthy-ai:
    source_id: "THM-005"
    vision: "intelligent-systems"
    title:
      en: "Physics-Informed and Trustworthy AI for Power Systems"
      zh: "面向电力系统的物理信息与可信 AI"
    short_title:
      en: "Physics-Informed & Trustworthy AI"
      zh: "物理信息与可信 AI"
    summary:
      en: "Embed physical laws, network structure, uncertainty, operational constraints, and safety certificates into learning models for safety-critical power-system modeling, control, and optimization."
      zh: "将物理规律、网络结构、不确定性、运行约束和安全证书嵌入学习模型，支撑安全关键的电力系统建模、控制与优化。"
    keywords:
      en: ["Physics-Informed Learning", "Safe Reinforcement Learning", "Verifiable AI", "Learned Dynamics"]
      zh: ["物理信息学习", "安全强化学习", "可验证 AI", "学习型动态表征"]
    questions:
      - en: "Physics-grounded and certified learning"
        zh: "物理约束与可认证学习"
      - en: "Safe adaptation and generalization"
        zh: "安全自适应与泛化"
      - en: "Learnable dynamic representations"
        zh: "可学习的动态表征"
    evidence:
      - source_id: "WRK-031"
        title: "Inverter PQ Control With Trajectory Tracking Capability for Microgrids Based on Physics-Informed Reinforcement Learning"
        year: "2024"
        venue: "IEEE Transactions on Smart Grid"
        url: "https://doi.org/10.1109/TSG.2023.3277330"
      - source_id: "WRK-022"
        title: "Safe Reinforcement Learning for Grid-Forming Inverter Based Frequency Regulation with Stability Guarantee"
        year: "2025"
        venue: "Journal of Modern Power Systems and Clean Energy"
        url: "https://doi.org/10.35833/MPCE.2023.000882"

  engineering-agents:
    source_id: "THM-007"
    vision: "intelligent-systems"
    title:
      en: "Intelligent Engineering Agents and Automated Research"
      zh: "智能工程 Agent 与自动化科研"
    short_title:
      en: "Engineering Agents & Automated Research"
      zh: "工程 Agent 与自动化科研"
    summary:
      en: "Develop domain-grounded LLMs and agents that turn engineering intent into executable, traceable workflows evaluated through physical and numerical outcomes under human supervision."
      zh: "发展领域化大语言模型（LLMs）与工程 Agent，将工程意图转化为可执行、可追踪且由物理与数值结果验证的人机协同工作流。"
    keywords:
      en: ["Large Language Models", "Engineering Agents", "Outcome Verification", "Automated Science"]
      zh: ["大语言模型", "工程 Agent", "结果验证", "自动化科研"]
    questions:
      - en: "Executable engineering agents"
        zh: "可执行的工程智能体"
      - en: "Outcome-based agent verification and benchmarks"
        zh: "基于结果的 Agent 验证与基准"
      - en: "Human-supervised automated science"
        zh: "人类监督下的自动化科研"
    evidence:
      - source_id: "WRK-063"
        title: "Empowering Scientific Datasets with Large Language Models"
        year: "2024"
        venue: "SC24 Research Poster"
        url: "https://sc24.supercomputing.org/proceedings/poster/poster_files/post268s2-file3.pdf"
        note:
          en: "Public poster record; technical claims are not summarized here pending source review."
          zh: "公开海报记录；在完成原始来源审阅前，本页不据此概括技术结论。"

  decision-intelligence:
    source_id: "THM-006"
    vision: "intelligent-systems"
    title:
      en: "Decision Intelligence for Operation, Planning, and Control"
      zh: "面向运行、规划与控制的决策智能"
    short_title:
      en: "Decision Intelligence"
      zh: "决策智能"
    summary:
      en: "Connect forecasts and learned representations to feasible, reliable, and computationally tractable engineering decisions under limited data, structural change, and uncertainty."
      zh: "在有限数据、结构变化和不确定性条件下，将预测与学习型表征连接到可行、可靠且计算可承受的工程决策。"
    keywords:
      en: ["Forecasting", "Uncertainty", "Prediction-to-Decision", "Predictive Control"]
      zh: ["预测", "不确定性", "预测到决策", "预测控制"]
    questions:
      - en: "Forecasting under novelty and limited data"
        zh: "新情景与有限数据下的预测"
      - en: "Prediction-to-decision coupling"
        zh: "预测与决策的耦合"
    evidence:
      - source_id: "WRK-035"
        title: "Machine learning-assisted prediction of heat fluxes through thermally anisotropic building envelopes"
        year: "2023"
        venue: "Building and Environment"
        url: "https://doi.org/10.1016/j.buildenv.2023.110157"
      - source_id: "WRK-043"
        title: "A Machine Learning-Assisted Framework to Control Thermally Anisotropic Building Envelopes in Residential Buildings"
        year: "2022"
        venue: "Buildings XV International Conference"
        url: "https://www.osti.gov/biblio/1923208"

  ai-infrastructure:
    source_id: "THM-008"
    vision: "intelligent-systems"
    title:
      en: "AI Infrastructure and Grid Co-Design"
      zh: "AI 基础设施与电网协同设计"
    short_title:
      en: "Grid–AI Infrastructure Co-Design"
      zh: "电网–AI 基础设施协同设计"
    summary:
      en: "Co-design AI workloads and data centers with thermal, electrical, and grid layers to preserve computing service while improving reliability, economic performance, and environmental outcomes."
      zh: "跨计算、热管理、电气和电网层协同设计 AI 工作负荷与数据中心，在保障计算服务的同时改善可靠性、经济性与环境表现。"
    keywords:
      en: ["Data Centers", "Flexible AI Workloads", "Grid Interaction", "Infrastructure Co-Design"]
      zh: ["数据中心", "灵活 AI 负荷", "电网友好交互", "基础设施协同设计"]
    questions:
      - en: "Grid-compatible and energy-efficient AI workloads"
        zh: "电网友好且节能的 AI 工作负荷"
      - en: "Energy-system co-design for AI infrastructure"
        zh: "面向 AI 基础设施的能源系统协同设计"
      - en: "Lifecycle and environmental impacts"
        zh: "全生命周期与环境影响"
    evidence:
      - source_id: "WRK-003"
        title: "PowerMorph: Shaping LLM Training for Data Center Demand Response"
        year: "2026"
        venue: "IEEE International Parallel and Distributed Processing Symposium"
        url: "https://doi.org/10.1109/IPDPS65963.2026.00100"

