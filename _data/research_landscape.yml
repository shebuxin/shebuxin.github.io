logic:
  - id: "models"
    title:
      en: "Models"
      zh: "模型"
    description:
      en: "Represent physical and learned system dynamics at the fidelity decisions require."
      zh: "以决策所需的精度表征物理动态与学习型动态。"
    theme_ids:
      - "ibr-dynamics"
      - "trustworthy-ai"
  - id: "boundaries"
    title:
      en: "Boundaries"
      zh: "边界"
    description:
      en: "Characterize stability, feasibility, capability, uncertainty, and safety limits."
      zh: "刻画稳定性、可行性、资源能力、不确定性与安全边界。"
    theme_ids:
      - "operating-boundaries"
      - "trustworthy-ai"
  - id: "decisions"
    title:
      en: "Decisions"
      zh: "决策"
    description:
      en: "Embed those limits in control, operation, planning, markets, and engineering workflows."
      zh: "将这些边界嵌入控制、运行、规划、市场与工程工作流。"
    theme_ids:
      - "dynamic-decisions"
      - "decision-intelligence"
      - "engineering-agents"
  - id: "outcomes"
    title:
      en: "Outcomes"
      zh: "结果"
    description:
      en: "Evaluate security, resilience, cost, reproducibility, and verifiability."
      zh: "从安全、韧性、成本、可复现性与可验证性评价最终结果。"
    theme_ids:
      - "resilience-security"
      - "engineering-agents"
      - "ai-infrastructure"

