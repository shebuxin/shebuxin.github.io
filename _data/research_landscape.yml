hero:
  statement:
    en: "Physics-grounded intelligence for verifiable power-system decisions"
    zh: "以物理机理与可信智能支撑可验证的电力系统决策"
  lede:
    en: "My research connects fast power-system dynamics with control, optimization, and trustworthy AI. The goal is to make modern grids with inverter-based resources secure, resilient, flexible, and economically efficient."
    zh: "我的研究将电力系统快速动态与控制、优化和可信人工智能相连接，旨在提升含基于逆变器的资源（IBRs）的现代电网在安全性、韧性、灵活性与经济性方面的表现。"
  stats:
    - value:
        en: "2"
        zh: "2"
      label:
        en: "research visions"
        zh: "大研究愿景"
    - value:
        en: "8"
        zh: "8"
      label:
        en: "connected themes"
        zh: "个相互关联的主题"
    - value:
        en: "Selected"
        zh: "精选"
      label:
        en: "public evidence"
        zh: "公开研究成果"
  navigation:
    label:
      en: "On this page"
      zh: "本页导航"
    items:
      - target: "research-visions"
        label:
          en: "Visions"
          zh: "研究愿景"
      - target: "research-logic"
        label:
          en: "Research logic"
          zh: "研究逻辑"
      - target: "research-themes"
        label:
          en: "Themes"
          zh: "研究主题"
      - target: "research-evidence"
        label:
          en: "Explore"
          zh: "继续探索"

sections:
  visions:
    title:
      en: "Two complementary research visions"
      zh: "两项相互补充的研究愿景"
    intro:
      en: "One vision develops the physical and mathematical foundations of IBR-dominant grids. The other develops intelligent models, agents, and infrastructure that operate within those foundations."
      zh: "第一项愿景建立 IBR 主导电网的物理与数学基础；第二项愿景发展能够在这些基础上运行的智能模型、工程智能体与基础设施。"
  logic:
    title:
      en: "How the research connects"
      zh: "各研究方向如何连接"
    intro:
      en: "Across both visions, the portfolio follows a common path from representation to measurable engineering outcomes. AI appears throughout this path as both a method and an infrastructure."
      zh: "两项愿景遵循一条从系统表征走向可衡量工程结果的共同路径；人工智能既是贯穿其中的方法，也是需要与电网协同设计的基础设施。"
  themes:
    title:
      en: "Research themes"
      zh: "研究主题"
    intro:
      en: "Each theme states the core research question, the methods I use, and selected public evidence. The complete publication record remains on the Publications page."
      zh: "每个主题概括核心研究问题、主要方法与精选公开成果；完整论文记录仍由“论文”页面集中展示。"
  evidence:
    title:
      en: "Explore the evidence and collaborations"
      zh: "查看研究成果与合作方向"
    intro:
      en: "The portfolio is a structured view of my research agenda. Publications document the evidence, while Projects describe sponsored programs and research roles."
      zh: "本页展示研究议程的整体结构；“论文”页面记录研究成果，“项目”页面介绍资助计划与研究职责。"

